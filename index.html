<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff6f8">
<title>Hannah's 19th — A Little Journey</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:#62576b;background:#fff7f7}
button{font:inherit;cursor:pointer}
#app{position:fixed;inset:0;overflow:hidden;background:linear-gradient(135deg,#fff8f4,#f7f0ff 52%,#eaf9ff)}
.scene{position:absolute;inset:0;display:none;overflow:hidden}
.scene.active{display:block;animation:sceneIn .8s ease both}
@keyframes sceneIn{from{opacity:0;transform:scale(1.025)}to{opacity:1;transform:scale(1)}}
.bg{position:absolute;inset:0;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.65;animation:float 8s ease-in-out infinite}
.b1{width:34vw;height:34vw;background:#ffddea;left:-8vw;top:-10vw}.b2{width:28vw;height:28vw;background:#dff4ff;right:-7vw;bottom:-7vw;animation-delay:-3s}.b3{width:18vw;height:18vw;background:#eee4ff;left:43%;top:8%;animation-delay:-5s}
@keyframes float{50%{transform:translate(12px,-14px)}}
.cloud{position:absolute;width:150px;height:48px;background:#fff;border-radius:40px;box-shadow:0 10px 25px #9c7f9d18;opacity:.8;animation:cloud 14s linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}.cloud:before{width:65px;height:65px;left:25px;bottom:10px}.cloud:after{width:80px;height:80px;left:70px;bottom:4px}
.c1{top:13%;left:-180px}.c2{top:67%;left:-220px;animation-delay:-7s;transform:scale(.75)}
@keyframes cloud{to{left:110%}}
.stars{position:absolute;inset:0}.star{position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 13px #fff;animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.25;transform:scale(.55)}}
.topbar{position:absolute;left:24px;right:24px;top:18px;display:flex;align-items:center;justify-content:space-between;z-index:20}
.brand{font-weight:900;letter-spacing:.08em;color:#866d88;font-size:13px}.progress{display:flex;gap:5px}.dot{width:7px;height:7px;border-radius:50%;background:#e8cbd9}.dot.on{background:#ff9fc3}
.content{position:absolute;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);width:min(920px,90vw);text-align:center}
.kicker{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#a187a1;font-weight:900}
h1{font-size:clamp(38px,7vw,76px);line-height:.95;margin:12px 0;color:#755f78;letter-spacing:-.04em}
h2{font-size:clamp(28px,5vw,50px);margin:8px 0;color:#755f78}
p{font-size:clamp(15px,2vw,19px);line-height:1.6;margin:10px auto;max-width:690px}
.card{background:#ffffffc9;border:1px solid #fff;box-shadow:0 25px 70px #846b841c,0 5px 18px #ffb5cf18;backdrop-filter:blur(12px);border-radius:28px;padding:24px}
.btn{border:2px solid #ffb5cf;background:linear-gradient(135deg,#fff,#ffe8f1);color:#68586e;border-radius:999px;padding:13px 22px;font-weight:900;box-shadow:0 9px 22px #ff9fc32a;transition:.2s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{transform:translateY(-3px) scale(1.02)}.btn.secondary{border-color:#bcdff0;background:#effaff}
.btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.speech{margin:18px auto;padding:15px 20px;background:#fff;border:2px solid #ffd2e1;border-radius:22px;max-width:620px;box-shadow:0 12px 28px #846b8416;min-height:60px}
.speech b{color:#ff78a9}.tiny{font-size:12px;color:#9b8ca0}
.scene-art{position:absolute;z-index:4}
.shero{width:180px;height:220px;left:7vw;bottom:7vh;animation:bob 3.6s ease-in-out infinite}
.shero .head{position:absolute;width:112px;height:112px;background:#f4caa7;border-radius:48% 48% 44% 44%;left:34px;top:20px;box-shadow:inset 0 -7px #e9b88d}
.shero .hair{position:absolute;width:126px;height:70px;background:#5d4d62;border-radius:60% 55% 35% 40%;left:27px;top:8px;transform:rotate(-5deg)}
.shero .eye{position:absolute;width:8px;height:12px;background:#5b5061;border-radius:50%;top:76px}.shero .e1{left:61px}.shero .e2{left:105px}
.shero .smile{position:absolute;width:25px;height:12px;border-bottom:3px solid #a76b79;border-radius:50%;left:76px;top:94px}
.shero .body{position:absolute;width:135px;height:100px;background:#9ccfe8;border-radius:35px 35px 25px 25px;left:22px;top:126px}
.shero .heart{position:absolute;left:73px;top:154px;color:#ff8fb5;font-size:26px}
.shero .arm{position:absolute;width:48px;height:18px;background:#f4caa7;border-radius:20px;top:151px}.shero .a1{left:2px;transform:rotate(20deg)}.shero .a2{right:0;transform:rotate(-25deg)}
.mascot{width:150px;height:145px;right:8vw;bottom:9vh;animation:bob 3s ease-in-out infinite reverse}
.mascot .ear{position:absolute;width:42px;height:48px;background:#fff;border:5px solid #e9d8df;border-radius:50%;top:0}.mascot .ear1{left:22px;transform:rotate(-20deg)}.mascot .ear2{right:22px;transform:rotate(20deg)}
.mascot .face{position:absolute;left:18px;top:28px;width:114px;height:105px;background:#fff;border:5px solid #e9d8df;border-radius:48% 48% 45% 45%;box-shadow:0 12px 25px #846b8415}
.mascot .eye{position:absolute;top:66px;width:7px;height:10px;background:#655a6c;border-radius:50%}.mascot .m1{left:52px}.mascot .m2{left:83px}
.mascot .cheek{position:absolute;width:16px;height:8px;background:#ffb7ca;border-radius:50%;top:83px}.mascot .ch1{left:31px}.mascot .ch2{right:31px}
.mascot .mouth{position:absolute;left:67px;top:79px;width:13px;height:8px;border-bottom:2px solid #655a6c;border-radius:50%}
@keyframes bob{50%{transform:translateY(-10px)}}
.sticker{position:absolute;font-weight:900;color:#9b7890;background:#fff9;border:2px dashed #ffc2d7;padding:9px 13px;border-radius:18px;transform:rotate(-5deg);animation:sticker 4s ease-in-out infinite}
@keyframes sticker{50%{transform:rotate(4deg) translateY(-5px)}}

/* map */
.map{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:850px;margin:24px auto}
.node{min-height:115px;border:2px solid #ffd1e0;background:#fff9;border-radius:24px;padding:16px;text-align:left;transition:.2s;position:relative;overflow:hidden}
.node:hover{transform:translateY(-4px)}.node.lock{opacity:.45;filter:grayscale(.3)}
.node strong{display:block;color:#755f78;font-size:17px}.node span{font-size:12px;color:#998b9e}
.badge{position:absolute;right:12px;top:12px;font-size:11px;color:#ff79a9}
@media(max-width:650px){.map{grid-template-columns:repeat(2,1fr);gap:9px}.node{min-height:96px;padding:12px}.shero{left:-4vw;transform:scale(.72)}.mascot{right:-3vw;transform:scale(.68)}.speech{max-width:86vw}.content{width:92vw}.topbar{left:14px;right:14px}}

/* quiz */
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:700px;margin:20px auto}.answer{padding:16px;border:2px solid #f4d1df;border-radius:20px;background:#fff9;color:#6b5c70;font-weight:800}.answer:hover{background:#fff0f6;transform:translateY(-2px)}
.result{min-height:28px;font-weight:900;color:#ff79a9}

/* games */
.game-area{height:310px;max-width:760px;margin:15px auto;position:relative;border-radius:28px;background:linear-gradient(#e9f8ff,#fff9);border:2px solid #d8edf4;overflow:hidden}
.bean{position:absolute;width:25px;height:34px;border-radius:50%;background:#a97755;box-shadow:inset -5px -5px #80553e;cursor:pointer;animation:fall 2.7s linear forwards}
@keyframes fall{from{top:-40px;transform:rotate(0)}to{top:330px;transform:rotate(420deg)}}
.cup{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);font-size:54px;filter:drop-shadow(0 8px 8px #80604b22)}
.wifi{font-size:100px;display:inline-block;animation:shake .5s infinite alternate}@keyframes shake{to{transform:rotate(5deg)}}
.wifi.hp{filter:drop-shadow(0 0 16px #ffb0c5)}
.hit{position:absolute;font-weight:900;color:#ff78a9;animation:pop .6s forwards}@keyframes pop{to{transform:translateY(-35px);opacity:0}}
.horror{background:radial-gradient(circle at 50% 45%,#57455e 0,#2d2940 50%,#201f31 100%);color:#fff}
.horror h2,.horror p{color:#fff}.horror .content{max-width:760px}
.film{margin:20px auto;width:min(720px,88vw);height:250px;background:#171522;border:8px solid #6e5b68;border-radius:14px;box-shadow:0 0 0 3px #171522,0 20px 60px #0007;display:grid;place-items:center;position:relative;overflow:hidden}
.film:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 7px,#fff1 8px 9px);animation:film 1s linear infinite}@keyframes film{to{transform:translateY(9px)}}
.sea{background:linear-gradient(#ffe8c9 0%,#ffdce9 35%,#cdeeff 70%,#9fd8ed 100%)}
.sun{position:absolute;width:125px;height:125px;border-radius:50%;background:#fff1a8;right:13%;top:17%;box-shadow:0 0 60px #fff1a8}
.wave{position:absolute;left:-5%;width:110%;height:110px;background:#fff9;border-radius:50% 50% 0 0/35% 35% 0 0;bottom:0;animation:wave 5s ease-in-out infinite}
.wave.w2{bottom:55px;opacity:.55;animation-delay:-2s}@keyframes wave{50%{transform:translateX(-2%) translateY(-7px)}}
.letter{max-height:70vh;overflow:auto;text-align:left;line-height:1.9;font-size:16px}
.envelope{width:250px;height:160px;margin:20px auto;background:#ffd4e4;border-radius:15px;position:relative;box-shadow:0 20px 50px #846b8425;cursor:pointer}
.envelope:after{content:"";position:absolute;left:0;right:0;top:0;border-left:125px solid transparent;border-right:125px solid transparent;border-top:85px solid #ffb7d0}
.envelope span{position:absolute;z-index:2;left:50%;top:62px;transform:translateX(-50%);font-size:30px}
.secretpad{display:grid;grid-template-columns:repeat(3,65px);gap:9px;justify-content:center;margin:18px}.key{height:55px;border:2px solid #d9c8e4;border-radius:17px;background:#fff;font-weight:900;color:#695a70}.code{letter-spacing:8px;font-size:24px;min-height:34px}
.achievements{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px}.ach{padding:8px 12px;border-radius:999px;background:#fff;border:2px solid #ffd1e0;font-size:12px;font-weight:900;color:#8b6c82}
.hidden{display:none!important}
.confetti{position:absolute;width:10px;height:18px;border-radius:4px;top:-30px;animation:conf 3.5s linear forwards}@keyframes conf{to{top:110%;transform:rotate(720deg) translateX(80px)}}
.credit{font-size:12px;color:#9a8b9e;margin-top:14px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const app=document.getElementById('app');
const scenes=[];
let progress=0, heart=0, achievements=new Set(), quizIndex=0, coffeeScore=0, wifiHP=5, code="";
const sceneNames=["Waiting Room","Birthday Door","Journey Map","Hannah Quiz","Memory Film","Wi-Fi Boss","Little Things","Flower Garden","Coffee Rush","Memory Album","Across the Sea","Future Room","The Letter","Final Night","Secret 209"];

function base(id,title,kicker="") {
  return `<section class="scene" id="s${id}"><div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="stars">${Array.from({length:18},(_,i)=>`<i class="star" style="left:${(i*37)%97}%;top:${(i*53)%88}%;animation-delay:${(i%7)*.3}s"></i>`).join('')}</div></div><div class="topbar"><div class="brand">HANNAH • 19</div><div class="progress">${Array.from({length:15},(_,i)=>`<i class="dot" id="d${i}"></i>`).join('')}</div></div><div class="content"><div class="kicker">${kicker}</div><h2>${title}</h2></div></section>`;
}
function setScene(n){
  scenes.forEach((s,i)=>s.classList.toggle('active',i===n-1));
  progress=Math.max(progress,n); scenes.forEach((_,i)=>{const d=document.getElementById('d'+i); if(d)d.classList.toggle('on',i<progress)});
}
function award(name){
  if(!achievements.has(name)){achievements.add(name); toast("Achievement unlocked: "+name)}
}
function toast(text){
  const x=document.createElement('div');x.textContent=text;
  x.style=`position:fixed;z-index:99;left:50%;top:24px;transform:translateX(-50%);padding:13px 18px;background:#fff;border:2px solid #ffd0e0;border-radius:999px;box-shadow:0 12px 30px #846b8422;font-weight:900;color:#7d6178`;
  document.body.appendChild(x);setTimeout(()=>x.remove(),2200);
}
function next(n){setScene(n); window.scrollTo(0,0)}
function confetti(){
  for(let i=0;i<55;i++){let c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.background=['#ffb4cf','#c7b3ff','#aee4f5','#ffe49c'][i%4];c.style.animationDelay=Math.random()*1.4+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),4500)}
}

/* 1 */
app.innerHTML+=base(1,"Hey Hannah…","A tiny cinematic birthday journey");
document.querySelector('#s1 .content').innerHTML=`
<div class="kicker">SEPTEMBER 7 • A VERY IMPORTANT DELIVERY</div>
<h1>Hey, Hannah…</h1>
<div class="speech" id="introSpeech"><b>Shero:</b> “Psst… is she here yet?”</div>
<p id="introSub">Two slightly nervous characters have been waiting for you.</p>
<div class="btnrow"><button class="btn" id="openBtn">Open it ♡</button></div>
<div class="sticker" style="left:10%;top:19%">classified birthday mission</div>
<div class="sticker" style="right:11%;top:23%;transform:rotate(5deg)">do NOT panic</div>`;
document.querySelector('#s1').insertAdjacentHTML('beforeend',`
<div class="scene-art shero"><div class="hair"></div><div class="head"><i class="eye e1"></i><i class="eye e2"></i><i class="smile"></i></div><div class="body"></div><div class="heart">♥</div><div class="arm a1"></div><div class="arm a2"></div></div>
<div class="scene-art mascot"><div class="ear ear1"></div><div class="ear ear2"></div><div class="face"><i class="eye m1"></i><i class="eye m2"></i><i class="cheek ch1"></i><i class="cheek ch2"></i><i class="mouth"></i></div></div>`);
let introStep=0;
document.getElementById('openBtn').onclick=()=>{
 introStep++;
 const speech=document.getElementById('introSpeech'),sub=document.getElementById('introSub');
 if(introStep===1){speech.innerHTML='<b>Tiny friend:</b> “She’s here! ACT NORMAL.”';sub.textContent='“I am acting normal.” — Shero, clearly not acting normal.'}
 else if(introStep===2){speech.innerHTML='<b>Shero:</b> “Okay Hannah. This is your birthday mission.”';sub.textContent='“Nineteen years deserves more than a normal Happy Birthday.”'}
 else {award("First Step");next(2)}
};

/* 2 */
app.innerHTML+=base(2,"The Birthday Door","Scene 02 • arrival");
document.querySelector('#s2 .content').innerHTML=`
<div class="kicker">SCENE 02</div><h1>19 looks good on you.</h1>
<div class="card"><p>Before the journey starts, there is one rule:</p><h2>you are absolutely allowed to be spoiled today.</h2><p class="tiny">Shero has prepared an unreasonable amount of effort. Please pretend to be impressed.</p></div>
<div class="btnrow"><button class="btn" id="door">Enter the birthday room ✦</button></div>`;
document.getElementById('door').onclick=()=>{award("Birthday Door");next(3)};

/* 3 map */
app.innerHTML+=base(3,"The Journey Map","Scene 03 • choose your path");
document.querySelector('#s3 .content').innerHTML=`
<div class="kicker">YOUR LITTLE WORLD</div><h2>Pick a glowing door.</h2>
<p>Every completed stop unlocks another. There are secrets hiding between the obvious things.</p>
<div class="map" id="map"></div>
<div class="achievements" id="ach"></div>`;
const nodes=[
["Quiz","A tiny test of Hannah knowledge",4],["Horror Memory","One movie. One memory. Zero bravery.",5],["Wi-Fi Boss","The legendary enemy.",6],
["Things I Love","Click what matters most.",7],["Flower Garden","Collect seven little flowers.",8],["Coffee Rush","Catch the beans.",9],
["Memory Album","Three moments, one feeling.",10],["Across the Sea","Distance gets a softer meaning.",11],["Future Room","Choose what comes next.",12],
["The Letter","Read slowly.",13],["Final Night","The stars have something to say.",14],["Secret 209","For curious birthday girls.",15]
];
function renderMap(){
 const m=document.getElementById('map');m.innerHTML='';
 nodes.forEach((x,i)=>{
  const unlocked=progress>=x[2]-1;
  const el=document.createElement('button');el.className='node '+(!unlocked?'lock':'');
  el.innerHTML=`<strong>${x[0]}</strong><span>${x[1]}</span><b class="badge">${unlocked?'OPEN':'LOCKED'}</b>`;
  if(unlocked)el.onclick=()=>next(x[2]); else el.onclick=()=>toast("Finish a little more of the journey first ♡");
  m.appendChild(el);
 });
 document.getElementById('ach').innerHTML=[...achievements].map(x=>`<span class="ach">✦ ${x}</span>`).join('')||'<span class="tiny">Achievements will appear here.</span>';
}
document.querySelector('#s3').addEventListener('click',()=>setTimeout(renderMap,50));

/* 4 quiz */
app.innerHTML+=base(4,"Hannah Quiz","Scene 04 • no cheating");
document.querySelector('#s4 .content').innerHTML=`
<div class="kicker">QUESTION <span id="qn">1</span> / 4</div><h2 id="q"></h2><div class="answers" id="answers"></div><div class="result" id="qr"></div>`;
const qs=[
["What kind of drink does Hannah love?","Coffee",["Coffee","Soup","Sparkling water","Air"]],
["Which game does Shero play with her?","Roblox",["Roblox","Chess","Tetris","Hide and Seek IRL"]],
["What was the first song Shero heard from her?","My Flower Girl",["My Flower Girl","Stand By Me","A random alarm","The Wi-Fi anthem"]],
["What became a sweet memory after watching it together?","Our first horror movie",["Our first horror movie","A cooking show","A documentary","A football match"]]
];
function loadQuiz(){
 const q=qs[quizIndex];document.getElementById('qn').textContent=quizIndex+1;document.getElementById('q').textContent=q[0];
 const a=document.getElementById('answers');a.innerHTML='';document.getElementById('qr').textContent='';
 q[2].forEach(v=>{const b=document.createElement('button');b.className='answer';b.textContent=v;b.onclick=()=>{if(v===q[1]){heart++;document.getElementById('qr').textContent="Correct. The tiny committee approves. ♡";}else document.getElementById('qr').textContent="Hmm… the committee is giving you a suspicious look. 😂";setTimeout(()=>{quizIndex++;if(quizIndex<4)loadQuiz();else{award("Hannah Scholar");next(5)}},700)};a.appendChild(b)})
}
loadQuiz();

/* 5 horror */
app.innerHTML+=base(5,"The Horror Movie Memory","Scene 05 • classified memory");
document.querySelector('#s5').classList.add('horror');
document.querySelector('#s5 .content').innerHTML=`
<div class="kicker">MEMORY REEL</div><h2>The night we watched our first horror movie.</h2>
<div class="film"><div><div style="font-size:42px">☾</div><b>PLAYING: “THE MOVIE WE SURVIVED”</b><p style="font-size:13px">The scary part was supposed to be the movie.<br>The sweet part was remembering it together.</p></div></div>
<div class="btnrow"><button class="btn" id="survive">I survived. Barely. →</button></div>`;
document.getElementById('survive').onclick=()=>{award("Horror Survivor");next(6)};

/* 6 wifi */
app.innerHTML+=base(6,"The Wi-Fi Boss Fight","Scene 06 • legendary incident");
document.querySelector('#s6 .content').innerHTML=`
<div class="kicker">BOSS BATTLE</div><h2>THE INTERNET HAS ENTERED THE CHAT.</h2>
<div class="wifi" id="router">📡</div><p>One tiny disconnection. One giant regret. Shero remembers the day he confessed and the internet decided to become a villain.</p>
<div class="card"><b>Router HP: <span id="hp">5</span>/5</b><div class="btnrow"><button class="btn" id="hitwifi">Defeat the router ✦</button><button class="btn secondary" id="forgive">Offer it a peaceful warning</button></div></div>
<div id="wifiMsg" class="result"></div>`;
document.getElementById('hitwifi').onclick=()=>{
 if(wifiHP>0){wifiHP--;document.getElementById('hp').textContent=wifiHP;document.getElementById('router').classList.add('hp');setTimeout(()=>document.getElementById('router').classList.remove('hp'),300);if(wifiHP===0){award("Wi-Fi Survivor");document.getElementById('wifiMsg').textContent="ROUTER DEFEATED. Justice has been served. 😂";setTimeout(()=>next(7),900)}}
};
document.getElementById('forgive').onclick=()=>document.getElementById('wifiMsg').textContent="Shero: “I forgive you… but I remember.”";

/* 7 */
app.innerHTML+=base(7,"The Little Things","Scene 07 • four things");
document.querySelector('#s7 .content').innerHTML=`
<div class="kicker">CLICK EACH LITTLE THING</div><h2>Things Shero loves about Hannah.</h2>
<div class="map" style="grid-template-columns:repeat(2,1fr);max-width:680px">
<button class="node love" data-t="Your voice">A tiny sound that can make an ordinary day feel softer.</button>
<button class="node love" data-t="Your eyes">The kind of detail that makes Shero forget what he was saying.</button>
<button class="node love" data-t="Your laugh">A little chaos. A lot of happiness.</button>
<button class="node love" data-t="Your style">Effortless. Pretty. Very Hannah.</button>
</div><div id="loveText" class="speech">Click one. Then another. We have time. ♡</div>`;
let loves=0;document.querySelectorAll('.love').forEach(b=>b.onclick=()=>{b.style.background="#fff0f6";document.getElementById('loveText').innerHTML='<b>'+b.dataset.t+'</b><br>'+b.textContent;loves++;if(loves>=4){award("Soft Heart");setTimeout(()=>next(8),700)}});

/* 8 garden */
app.innerHTML+=base(8,"Hannah's Flower Garden","Scene 08 • seven flowers");
document.querySelector('#s8 .content').innerHTML=`
<div class="kicker">A LITTLE GARDEN</div><h2>Pick seven flowers.</h2><p>Some things remind Shero of Hannah: flowers, the sea, quiet moments, and the hope of getting to talk like before.</p>
<div id="garden" style="position:relative;height:280px;max-width:760px;margin:auto;background:linear-gradient(#f7efff,#f1fbff);border-radius:30px;border:2px solid #fff"></div><div id="flowerMsg" class="result"></div>`;
let flowers=0;const garden=document.getElementById('garden');
for(let i=0;i<7;i++){let b=document.createElement('button');b.textContent="✿";b.style=`position:absolute;left:${8+((i*127)%82)}%;top:${30+((i*71)%55)}%;font-size:34px;border:0;background:transparent;color:#ff91b6;transition:.3s`;b.onclick=()=>{if(!b.disabled){b.disabled=true;b.style.transform="scale(1.35)";flowers++;document.getElementById('flowerMsg').textContent=`Flower ${flowers}/7 collected ♡`;if(flowers===7){award("Flower Keeper");setTimeout(()=>next(9),800)}}};garden.appendChild(b)}

/* 9 coffee */
app.innerHTML+=base(9,"Coffee Rush","Scene 09 • 8 beans");
document.querySelector('#s9 .content').innerHTML=`
